services:
  open-webui:
    build:
      context: ..
      args:
        UPSTREAM_VERSION: ${UPSTREAM_VERSION:-v0.11.3}
    environment:
      - WEBUI_ROOT_PATH=/openwebui
      - ENABLE_PERSISTENT_CONFIG=False
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=https://ollama.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY_VALUE}
      - DEFAULT_PINNED_MODELS=kimi-k2.6
      - DEFAULT_MODELS=kimi-k2.6
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,nginx,open-webui}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1,nginx,open-webui}
      - PROXY_CA_CERT_B64=${PROXY_CA_CERT_B64:-}
    volumes:
      - ./trust-sbx-proxy.sh:/tmp/trust-sbx-proxy.sh:ro
    command: ["bash", "-c", "/tmp/trust-sbx-proxy.sh; exec bash start.sh"]
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - open-webui
    networks:
      - frontend
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend: