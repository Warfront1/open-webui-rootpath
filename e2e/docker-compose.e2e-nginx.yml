services:
  open-webui:
    build:
      context: ..
      args:
        UPSTREAM_VERSION: ${UPSTREAM_VERSION:-v0.9.5}
    environment:
      - WEBUI_ROOT_PATH=/openwebui
      - ENABLE_PERSISTENT_CONFIG=False
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=https://ollama.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY_VALUE}
      - DEFAULT_PINNED_MODELS=kimi-k2.6
      - DEFAULT_MODELS=kimi-k2.6
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - open-webui
    networks:
      - frontend
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend: