services:
  open-webui:
    ports:
      - "8080:8080"
    build:
      context: .
      args:
        # Read from UPSTREAM_VERSION file: UPSTREAM_VERSION=$(cat UPSTREAM_VERSION) docker compose build
        UPSTREAM_VERSION: ${UPSTREAM_VERSION:-v0.11.0}
    environment:
      - WEBUI_ROOT_PATH=/openwebui
      - ENABLE_PERSISTENT_CONFIG=False
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=https://ollama.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY_VALUE}
      - DEFAULT_PINNED_MODELS=kimi-k2.6
      - DEFAULT_MODELS=kimi-k2.6
#      - ENABLE_OPENAI_API_PASSTHROUGH=true
#    volumes:
#      - open-webui-data:/app/backend/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - open-webui
    restart: unless-stopped

volumes:
  open-webui-data: